<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terminal / Helix</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="crt-overlay"></div>
    <div class="page-shell fade-in">
      <header class="topbar">
        <div class="brand">TERMINAL / LOCAL</div>
        <nav class="nav-links">
          <a href="index.html">Home</a>
          <a href="terminal.html" class="active">Terminal</a>
          <a href="archive.html">Archive</a>
          <a href="personnel.html">Personnel</a>
        </nav>
      </header>

      <main>
        <section class="hero compact">
          <p class="status-line">RESEARCH CONSOLE / ACCESS LIMITED</p>
          <h1 class="glitch-text">Operator Interface</h1>
          <p class="lead">
            Input commands to survey the environment. Some responses arrive without waiting for a prompt.
          </p>
        </section>

        <section class="terminal-window">
          <div class="terminal-output" id="terminalOutput"></div>
          <form class="terminal-form" id="terminalForm">
            <label for="commandInput">root@helix:~$</label>
            <input id="commandInput" autocomplete="off" spellcheck="false" />
          </form>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
